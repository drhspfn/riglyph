name: Riglyph npm release (Trusted Publishing / OIDC)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published GitHub Release tag for a controlled retry'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Verify release tag, merged PR and its successful label-triggered CI
        uses: actions/github-script@v7
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            const tag = manual ? context.payload.inputs?.release_tag : context.payload.release?.tag_name;
            if (manual && context.ref !== 'refs/heads/main') return core.setFailed('Manual recovery must run from main');
            const release = await github.rest.repos.getReleaseByTag({owner:context.repo.owner,repo:context.repo.repo,tag});
            if (release.data.draft || release.data.prerelease || !release.data.published_at)
              return core.setFailed('Only an existing published stable release can be deployed');
            if (!/^v?(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(tag ?? ''))
              return core.setFailed('Release tag must be a valid vSemVer tag');
            const {owner,repo} = context.repo;
            const ref = await github.rest.git.getRef({owner,repo,ref:'tags/'+tag});
            let sha = ref.data.object.sha;
            if (ref.data.object.type === 'tag') {
              const annotated = await github.rest.git.getTag({owner,repo,tag_sha:sha});
              if (annotated.data.object.type !== 'commit') return core.setFailed('Tag must resolve to a commit');
              sha = annotated.data.object.sha;
            }
            if (!manual && sha !== context.sha) return core.setFailed('Release checkout SHA does not match tag commit');
            const comparison = await github.rest.repos.compareCommits({owner,repo,base:sha,head:'main'});
            if (!['ahead','identical'].includes(comparison.data.status))
              return core.setFailed('Release commit is not reachable from main');
            // CI is gated by the PR label 'ci:run'; merging is deliberately
            // not a second CI trigger. Trust only a successful run for the
            // exact HEAD of the PR that produced the release commit.
            const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit,{
              owner,repo,commit_sha:sha,per_page:100
            });
            const accepted = associated.filter(p=>p.merged_at && p.base.ref==='main' &&
              p.merge_commit_sha===sha);
            if (!accepted.length)
              return core.setFailed('Release commit must be the accepted merge/squash commit of a validated PR');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns,{
              owner,repo,workflow_id:'ci.yml',event:'pull_request',per_page:100
            });
            const verified = accepted.some(p=>runs.some(r=>
              r.head_sha===p.head.sha &&
              r.conclusion==='success' &&
              r.event==='pull_request' &&
              r.pull_requests?.some(q=>q.number===p.number)));
            if (!verified)
              return core.setFailed('No successful label-triggered CI on the exact merged PR head; release blocked');
            // In particular, no duplicate main-branch CI is needed.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@^11.5.1
      - run: node --version && npm --version
      - name: Verify tag matches all package versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const root=JSON.parse(fs.readFileSync("package.json"));
            if(![root.version,`v${root.version}`].includes(process.env.RELEASE_TAG))throw Error("Tag must equal root package version, optionally prefixed by v");
            for(const name of ["core","importer-sdk","runtime","renderer-webgl2","renderer-cpu","renderer-native","importer-spine-4.1","player-web","cli"]){
              const pkg=JSON.parse(fs.readFileSync(`packages/${name}/package.json`));
              if(pkg.version!==root.version)throw Error(`Version mismatch: ${name}`);
            }
          '
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm run typecheck && npm test
      - run: npm run pack:check && npm run release:verify && npm run release:dry-run
      - name: Verify scope and owner configuration
        run: |
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('packages/core/package.json'));if(p.repository.url.includes('/OWNER/'))process.exit(1)"
      - name: Check all nine npm versions are unpublished
        env:
          RIGLYPH_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: node scripts/check-npm-prepublish.mjs
      - name: Save prepublish evidence
        uses: actions/upload-artifact@v4
        with:
          name: riglyph-prepublish-evidence
          path: |
            release-packages/*.tgz
            release-packages/manifest.json
            release-artifacts/*
      - name: Validate selected npm authentication method
        env:
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          case "$NPM_PUBLISH_MODE" in
            oidc) echo 'Using npm Trusted Publishing (OIDC)' ;;
            token)
              if [ "$HAS_NPM_TOKEN" != 'true' ]; then
                echo 'NPM_TOKEN secret is required for token mode' >&2
                exit 1
              fi
              echo 'Using npm granular access token'
              ;;
            *) echo 'Set Environment variable NPM_PUBLISH_MODE to oidc or token' >&2; exit 1 ;;
          esac
      - name: Publish via selected npm authentication method
        env:
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RIGLYPH_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: node scripts/publish-approved.mjs
      # Configure Environment 'npm-release' variable NPM_PUBLISH_MODE=oidc|token.
      # For token mode also configure an Environment secret NPM_TOKEN.
      # npm OIDC is used only when explicitly selected, never as silent fallback.
      # A failed partial publish is fatal; published npm versions are immutable.
