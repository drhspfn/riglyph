name: Riglyph approved npm release (manual + OIDC)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Exact text PUBLISH v0.15.1; execute only on the protected v0.15.1 tag'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event.inputs.confirm == 'PUBLISH v0.15.1' && github.ref_type == 'tag' && github.ref_name == 'v0.15.1'
    runs-on: ubuntu-latest
    environment: npm-release  # MUST configure owner-required reviewers before enabling
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify exact protected tag matches checkout and successful CI run
        uses: actions/github-script@v7
        with:
          script: |
            const tag=context.ref.replace('refs/tags/','');
            if(tag !== 'v0.15.1') core.setFailed('Ref must be protected release tag');
            const run=await github.rest.actions.listWorkflowRuns({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'ci.yml',head_sha:context.sha,per_page:100});
            const green=run.data.workflow_runs.some(r=>r.conclusion==='success' && r.event==='push' && r.head_sha===context.sha);
            if(!green) core.setFailed('No successful push CI for exact tagged SHA');
      - run: npm install --global npm@^11.5.1
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm run typecheck && npm test
      - run: npm run pack:check && npm run release:verify && npm run release:dry-run
      - name: Verify scope and owner configuration
        run: |
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('packages/core/package.json'));if(p.repository.url.includes('/OWNER/'))process.exit(1)"
      - name: Registry preflight rejects all already published or uncertain versions
        env:
          RIGLYPH_RELEASE_APPROVED: ${{ github.event.inputs.confirm }}
        run: node scripts/check-npm-prepublish.mjs
      - name: Upload dry-run evidence before publishing
        uses: actions/upload-artifact@v4
        with:
          name: riglyph-0.15.1-release-prepublish-evidence
          path: |
            release-packages/*.tgz
            release-packages/manifest.json
            release-artifacts/*
      - name: Publish in strict dependency order using npm Trusted Publisher / OIDC
        env:
          RIGLYPH_RELEASE_APPROVED: ${{ github.event.inputs.confirm }}
        run: node scripts/publish-approved.mjs
      # Never triggered by PR; never uses static NPM_TOKEN or NODE_AUTH_TOKEN.
      # A failed partial publish MUST be recovered manually; npm versions cannot be overwritten.
