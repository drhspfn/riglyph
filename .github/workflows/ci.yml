name: Riglyph CI (no publishing)
# Full validation is opt-in on PRs. A merge into main does not re-run
# the same matrix. After changing commits, remove/reapply the ci:run label.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
concurrency:
  group: a22-existing-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  workspaces:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:run' }}
    name: Workspaces (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      - name: Windows npm shim / convert rollback regression
        if: runner.os == 'Windows'
        run: node --test dist/tests/windows-tooling.test.js
      - run: npm run release:verify
      - run: npm run release:dry-run
      - name: Source and packed tree scanner
        run: node scripts/audit-release-tree.mjs
      - name: Check npm packs from outside workspace (Node and TS)
        run: node scripts/external-smoke.mjs
  browser:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:run' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run pack:check
      - run: python -m pip install playwright==1.55.0
      - name: Install Playwright Chromium without the Ubuntu Snap wrapper
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
          python -m playwright install --with-deps chromium
      - name: External npm packages + WebGL browser lifecycle
        run: xvfb-run -a npm run smoke:packages
      - name: G3 CPU/WebGL2 synthetic pixel parity
        run: xvfb-run -a python scripts/browser-g3-pixels.py
      - name: Full dynamic clipping geometry conformance
        run: xvfb-run -a python scripts/browser-geometry.py
      - name: Synthetic geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-browser
          path: test-output/geometry-browser/
      - name: G9 and G10 playback in Chromium
        run: |
          xvfb-run -a python scripts/browser-g9.py
          xvfb-run -a python scripts/browser-g10.py
      - name: Playground browser smoke
        run: xvfb-run -a python scripts/browser-playground.py
  frameworks:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:run' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run pack:check
      - run: node scripts/prepare-consumer-assets.mjs
      - name: React/Vite and Next.js production builds (real registry installation)
        run: FW_ALLOW_NETWORK=1 node scripts/framework-builds.mjs
      - run: python -m pip install playwright==1.55.0
      - name: Install Playwright Chromium without the Ubuntu Snap wrapper
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print('CHROMIUM_PATH=' + p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - run: python -m pip install pillow==11.3.0
      - name: Framework screenshot regression tests
        run: python -m unittest discover -s tests -p test_browser_frameworks.py
      - name: Production browsers, SSR and hydration smoke
        run: xvfb-run -a python scripts/browser-frameworks.py
      - name: Framework evidence (never treat missing deps as PASS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-build-evidence
          path: |
            framework-build-results.json
            framework-browser-artifacts/
            examples/react/package-lock.json
            examples/nextjs/package-lock.json
          if-no-files-found: warn

  headless-video:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:run' }}
    name: Headless video (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install FFmpeg and ffprobe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg and ffprobe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Validate real H.264 MP4 and VP9 alpha WebM outputs
        run: node --test dist/tests/headless-video.integration.js
      - name: Retain decoded and encoded A21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-video-${{ matrix.os }}-node${{ matrix.node }}
          path: test-output/headless-video/
          if-no-files-found: warn
