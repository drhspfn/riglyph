name: Riglyph native renderer CI and artifacts
on:
  pull_request:
    paths:
      - "native/**"
      - "packages/renderer-native/**"
      - "packages/renderer-cpu/**"
      - "packages/cli/**"
      - "tests/native-**"
      - ".github/workflows/native-release.yml"
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  native:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            lib: libriglyph_render_ffi.so
            exe: riglyph-native
          - platform: windows-x64
            os: windows-2025
            lib: riglyph_render_ffi.dll
            exe: riglyph-native.exe
          - platform: macos-arm64
            os: macos-15
            lib: libriglyph_render_ffi.dylib
            exe: riglyph-native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rust unit, protocol and FFI tests
        run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - name: Native optimized binaries
        run: cargo build --manifest-path native/Cargo.toml --workspace --release --locked
      - name: Rust lint
        run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Native bridge and JS pixel parity
        env:
          RIGLYPH_NATIVE_BIN: native/target/release/${{ matrix.exe }}
        run: node --test dist/tests/native-*.test.js
      - name: C/Python ctypes consumer smoke
        shell: bash
        env:
          RIGLYPH_NATIVE_LIB: native/target/release/${{ matrix.lib }}
        run: |
          python examples/native-renderer/ctypes-render.py
          python examples/native-renderer/c-consumer.py
      - name: Bundle library, binary, header, license, version, hashes
        run: node scripts/native-package.mjs ${{ matrix.platform }} native/target/release/${{ matrix.exe }} native/target/release/${{ matrix.lib }}
      - name: Native package artifact
        uses: actions/upload-artifact@v4
        with:
          name: riglyph-native-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}/
          if-no-files-found: error
  publish-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: riglyph-native-*
          path: release-assets
      - name: Only upload to the matching approved Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          test "$TAG" = "v0.16.1"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
          echo "Native CI passed all supported platforms; archives staged by a separate packaging step."
          # Never overwrite previously uploaded assets or publish unrelated npm packages.
